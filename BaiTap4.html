<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Menu ngang</title>
  <style>
    ul {
      list-style-type: none;   /* bỏ dấu chấm đầu dòng */
      margin: 0;
      padding: 0;
    }

    li {
      display: inline-block;   /* hiển thị các phần tử li trên cùng một hàng */
      width: 100px;            /* chiều rộng bằng nhau cho mỗi ô */
      padding: 10px 0;         /* khoảng đệm trên/dưới */
      margin-right: 5px;       /* khoảng cách giữa các ô */
      background-color: cyan;  /* màu nền */
      text-align: center;      /* căn giữa chữ */
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#">TMDT</a></li>
    <li><a href="#">ERP</a></li>
    <li><a href="#">MIS</a></li>
    <li><a href="#">DS</a></li>
  </ul>
</body>
</html>
